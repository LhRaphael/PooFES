<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLog - Small Release</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="profile.css" />
    <script src="/script.js"></script>

</head>
<body>
    <div class="mobile-frame">
        <header class="top-bar">
            <img src="images.avatar.png" alt="Usuário" class="user-avatar" />
            <h1>NOME USUARIO</h1>
        </header>

      
        
        <section class="action-bar" style="display: flex; flex-direction: column;">
            <h1>Informações pessoais</h1>
            <div class="info">
               <h1>nome:</h1>
               <h1>email:</h1>
               <h1>telefone:</h1>
               <h1>idade:</h1>
               <h1>altura:</h1>
               <h1>peso:</h1>
               <h1>imc:</h1>

            </div>
        </section>
        

     

        <!-- 🔹 Caixa de gráficos -->
        <section class="box" style="padding-top: 0; width: 88%; margin-left: auto; margin-right: auto; margin-top: 5px;  box-shadow: 1px 1px 2px black;">
            <h2>Evolução pessoal</h2>
            <div class="media" >
               
                <div class="photo">
                    <img src="" alt="">
                </div>
                
                <div class="photo">
                    <img src="" alt="">
                </div>

                <button style="width: 30px; height: 30px; background-color: red; border-radius: 10px;">></button>
            </div>
            <!-- Conteúdo futuro -->
        </section>
    </div>
</body>
</html>
